<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2626" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="100" fill="#050505" />

  <!-- Outer Ring - Left Red Arc -->
  <path d="M 176 112 A 165 165 0 0 0 176 400" 
        fill="none" 
        stroke="url(#redGradient)" 
        stroke-width="38" 
        stroke-linecap="round" />

  <!-- Outer Ring - Right White Arc -->
  <path d="M 336 112 A 165 165 0 0 1 336 400" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="38" 
        stroke-linecap="round" />

  <!-- Center 'i' Logo (Italicized Stem & 2x2 Red Grid Dot) -->
  <g transform="translate(256, 256) skewX(-14) translate(-256, -256)">
    <!-- White Stem -->
    <rect x="232" y="215" width="48" height="170" rx="8" fill="#ffffff" />

    <!-- Red Dot (2x2 Grid) -->
    <rect x="232" y="152" width="21" height="21" rx="4" fill="url(#redGradient)" />
    <rect x="259" y="152" width="21" height="21" rx="4" fill="url(#redGradient)" />
    <rect x="232" y="179" width="21" height="21" rx="4" fill="url(#redGradient)" />
    <rect x="259" y="179" width="21" height="21" rx="4" fill="url(#redGradient)" />
  </g>
</svg>